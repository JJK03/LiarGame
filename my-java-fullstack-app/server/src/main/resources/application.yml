server:
  port: 8080
  context-path: /api
  datasource:
    url: jdbc:mysql://localhost:3306/mydb
    username: root
    password: password
  logging:
    level:
      root: INFO
      com.example.server: DEBUG
  cors:
    allowed-origins: "*"
    allowed-methods: GET, POST, PUT, DELETE, OPTIONS
    allowed-headers: Content-Type, Authorization
  jwt:
    secret: mySecretKey
    expiration: 3600